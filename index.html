<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Busca en la web, comunidades y tus servicios favoritos desde un solo lugar." />
    <script>
      (() => {
        let saved = {};
        try { saved = JSON.parse(localStorage.getItem('searchall-preferences') || '{}'); } catch {}
        const preference = saved.theme || 'system';
        const theme = preference === 'system'
          ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          : preference;
        const language = saved.language || 'en';
        document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark';
        document.documentElement.lang = language === 'es' ? 'es' : 'en';
      })();
    </script>
    <title>Search ALL</title>
  </head>
  <body><div id="app"></div><script type="module" src="./src/main.js"></script></body>
</html>
